# Local development stack (feature 00 FR-010, task 08).
#
# PostgreSQL is the shared relational store (`PRD.md` s.54). MinIO is the default local
# S3-compatible implementation (`PRD.md` s.32, s.91) — the application depends on an
# ObjectStorage abstraction, never on MinIO directly.
#
# No schema, no migrations, no buckets beyond what the spike needs. Feature 01 creates the
# first migration; feature 05 owns the object storage layout.
#
# NOT VERIFIED: authored without Docker available on the machine that wrote it. First run
# by a developer confirms it, and fixes belong in task 08.

services:
  postgres:
    image: postgres:17-alpine
    container_name: rpg-postgres
    restart: unless-stopped
    # Logical replication is what a sync provider reads changes from (`PRD.md` s.55).
    # Set here rather than in the spike so the stack a developer starts is the stack
    # feature 03 needs.
    command: postgres -c wal_level=logical -c max_replication_slots=8 -c max_wal_senders=8
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rpg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rpg_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-rpg}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-rpg} -d ${POSTGRES_DB:-rpg}']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: rpg-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rpg}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rpg_dev_password}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: rpg-powersync-mongo
    restart: unless-stopped
    volumes:
      - powersync-mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ ping: 1 }).ok']
      interval: 5s
      timeout: 5s
      retries: 10

  powersync:
    image: journeyapps/powersync-service:1.25.0
    container_name: rpg-powersync
    restart: unless-stopped
    command: ['start', '-r', 'unified']
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      PS_DATA_SOURCE_URI: postgres://${POSTGRES_USER:-rpg}:${POSTGRES_PASSWORD:-rpg_dev_password}@postgres:5432/${POSTGRES_DB:-rpg}
      PS_MONGO_URI: mongodb://mongo:27017/powersync
      PS_PORT: 8080
      PS_CLIENT_AUTH_KEY: ${POWERSYNC_JWT_SECRET:-ZGV2ZWxvcG1lbnQtb25seS1wb3dlcnN5bmMta2V5LTMyIQ}
      PS_ADMIN_TOKEN: ${POWERSYNC_ADMIN_TOKEN:-development-only-admin-token}
      NODE_OPTIONS: --max-old-space-size=1000
    ports:
      - '${POWERSYNC_PORT:-8080}:8080'
    volumes:
      - ./infra/powersync:/config:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8080/probes/liveness').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 2s
      retries: 20

volumes:
  postgres-data:
  minio-data:
  powersync-mongo-data:
