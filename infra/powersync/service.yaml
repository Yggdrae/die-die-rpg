# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@1.25.0/json-schema/powersync-config.json
_type: self-hosted

telemetry:
  disable_telemetry_sharing: true

replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable

storage:
  type: mongodb
  uri: !env PS_MONGO_URI

port: !env PS_PORT

sync_config:
  path: sync-config.yaml

client_auth:
  audience: ['powersync']
  jwks:
    keys:
      - kty: oct
        alg: HS256
        kid: rpg-sync-hs256
        k: !env PS_CLIENT_AUTH_KEY

api:
  tokens:
    - !env PS_ADMIN_TOKEN

system:
  logging:
    level: info
    format: text
