# Throwaway PowerSync service config for the wave 0 spike (task 10).
#
# Answers one question: does a write made offline in local SQLite reach PostgreSQL and
# come back. Nothing here is production configuration — the dev secret is in the file on
# purpose, because this whole directory is deleted at the freeze tag.

telemetry:
  disable_telemetry_sharing: true

replication:
  connections:
    - type: postgresql
      uri: postgresql://rpg:rpg_dev_password@postgres:5432/rpg
      sslmode: disable

storage:
  type: postgresql
  uri: postgresql://rpg:rpg_dev_password@postgres:5432/powersync_storage
  sslmode: disable

port: 8080

sync_rules:
  path: /config/sync_rules.yaml

client_auth:
  jwks:
    keys:
      - kty: oct
        kid: spike
        alg: HS256
        k: c3Bpa2Utc2VjcmV0LWtleS1mb3Itd2F2ZS16ZXJvLW9ubHktMzJieXRlcw
  audience:
    - powersync-spike

api:
  tokens:
    - spike-admin-token-not-a-real-secret-0001
