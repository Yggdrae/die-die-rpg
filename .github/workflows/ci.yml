name: CI

# Full gates before merge, per docs/SPEC_GUIDELINE.md (Tests and Gates):
# lint, typecheck, tests, build, plus the architecture guard from feature 00 FR-009.
# No E2E job: Playwright arrives with the first user-facing flow.
# No coverage threshold: SPEC_GUIDELINE explicitly rejects it as a quality substitute.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        id: install
        run: bun install --frozen-lockfile

      # Every gate runs even after one fails, so a red run reports everything that is
      # wrong rather than the first thing. The job still fails if any step failed.
      # Without this, fixing a broken branch costs one push per gate.
      #
      # Gated on install succeeding: with no dependencies every gate fails for the same
      # uninteresting reason, which is noise, not information.
      - name: Lint and format
        if: always() && steps.install.outcome == 'success'
        run: bun run check

      - name: Typecheck
        if: always() && steps.install.outcome == 'success'
        run: bun run typecheck

      - name: Test
        if: always() && steps.install.outcome == 'success'
        run: bun test

      - name: Architecture guard
        if: always() && steps.install.outcome == 'success'
        run: bun run guard

      - name: Build
        if: always() && steps.install.outcome == 'success'
        run: bun run build
